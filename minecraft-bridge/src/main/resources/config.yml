# MinecraftBridge plugin configuration.
# The bot secret must match MC_BRIDGE_SECRET of the Discord bot.
enabled: true

bot:
  # Discord bot side bridge endpoint (private Docker network only).
  base-url: 'http://mcbot:47865'
  # Shared secret. Generate with: openssl rand -hex 32
  secret: 'CHANGE_ME'

server:
  # Interface/port this plugin listens on. Never publish this port to the host.
  bind: '0.0.0.0'
  port: 8765

timeouts:
  bot-connect-ms: 3000
  bot-request-ms: 3000
  sync-task-ms: 4000

queue:
  # Bounded event queue - oldest entries are dropped when it is full.
  capacity: 200
  workers: 2
  retry: 1
