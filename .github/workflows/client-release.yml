name: Minecraft client release

on:
  push:
    tags: ['client-v*']

permissions:
  contents: read

env:
  MINECRAFT_SERVER_ADDRESS: ${{ vars.MINECRAFT_SERVER_ADDRESS }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Build Windows installer
        shell: pwsh
        run: |
          if ($env:MINECRAFT_SERVER_ADDRESS -cnotmatch '\A(?:[A-Za-z0-9][A-Za-z0-9.-]*|\[[0-9A-Fa-f:]+\]):[0-9]{1,5}\z') {
            throw 'Set the MINECRAFT_SERVER_ADDRESS repository variable to the Java server host:port.'
          }
          Copy-Item server/mods.lock.json client/mods.lock.json
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags "-s -w -X main.serverAddress=$env:MINECRAFT_SERVER_ADDRESS" -o MCBot-Cobblemon-Setup.exe client/main.go
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }

      - name: Verify install and reinstall on Windows
        shell: pwsh
        run: ./client/smoke-test.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: MCBot-Cobblemon-Setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Package macOS installer
        shell: bash
        run: |
          cp server/mods.lock.json client/mods.lock.json
          app='Cobblemon Setup.app'
          mkdir -p "$app/Contents/MacOS"
          cp client/macos/Info.plist "$app/Contents/Info.plist"
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.serverAddress=$MINECRAFT_SERVER_ADDRESS" -o "$RUNNER_TEMP/CobblemonSetup-$arch" client/main.go
          done
          lipo -create "$RUNNER_TEMP/CobblemonSetup-arm64" "$RUNNER_TEMP/CobblemonSetup-amd64" -output "$app/Contents/MacOS/CobblemonSetup"
          codesign --sign - "$app"
          ditto -c -k --keepParent "$app" MCBot-Cobblemon-Setup-macOS.zip

      - name: Verify packaged app and install on macOS
        shell: bash
        run: |
          ditto -x -k MCBot-Cobblemon-Setup-macOS.zip dist
          app='dist/Cobblemon Setup.app'
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --strict "$app"
          lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/CobblemonSetup"
          pwsh -NoProfile -File client/smoke-test.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: MCBot-Cobblemon-Setup-macOS.zip
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-installer'
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" MCBot-Cobblemon-Setup.exe MCBot-Cobblemon-Setup-macOS.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Cobblemon client installers ($GITHUB_REF_NAME)" --notes-file - <<'EOF'
          공식 Minecraft Launcher에서 Java Edition에 로그인한 뒤 런처를 완전히 종료하세요.

          - Windows x64에서는 `MCBot-Cobblemon-Setup.exe`를 실행하세요.
          - macOS 11 이상에서는 `MCBot-Cobblemon-Setup-macOS.zip`을 풀고 `Cobblemon Setup.app`을 더블클릭하세요. Apple Silicon과 Intel을 모두 지원합니다. 앱은 Apple 공증을 받지 않았습니다. macOS가 실행을 막으면 [Apple의 앱 열기 안내](https://support.apple.com/ko-kr/102445)를 참고하세요.

          설치 후 Minecraft Launcher에서 **Cobblemon Server** 프로필을 실행하고 멀티플레이에 저장된 **Cobblemon Server**에 접속하세요.
          EOF
