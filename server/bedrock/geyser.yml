# Geyser fills in the remaining defaults on first start.
bedrock:
  address: 0.0.0.0
  port: 19132
  transport: nethernet
  # Enable after issuing and installing a certificate with renew-bedrock-tls.sh.
  # signaling:
  #   builtin:
  #     https:
  #       certificate: https/fullchain.pem
  #       private-key: https/privkey.pem
java:
  auth-type: floodgate
gameplay:
  # Avoid the first-command UI freeze on Bedrock clients.
  command-suggestions: false
advanced:
  bedrock:
    # Reduce compression CPU cost; uses more bandwidth than the default 6.
    compression-level: 4
config-version: 11
