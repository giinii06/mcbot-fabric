# =============================================================================
# Minecraft Java + Bedrock cross-play server  (managed by server/install.sh)
# Leaf 1.21.11 Build #179 / Java 21 / Geyser + Floodgate + ViaVersion + Chunky
#
# 컨테이너: minecraft (게임 서버), minecraft-backup (사이드카 백업)
# 포트: TCP 25565 (Java) / UDP 19132 (Bedrock)
# 이 디렉터리(server/)만 다른 호스트에 복사해도 그대로 기동됩니다.
# 봇과 함께 쓸 때는 루트의 mcbot compose와 외부 네트워크 mc-discord를 공유합니다.
# =============================================================================
name: minecraft

services:
  minecraft:
    image: itzg/minecraft-server:java21
    container_name: minecraft
    restart: unless-stopped
    stop_grace_period: 60s
    tty: true
    stdin_open: true
    ports:
      - "${JAVA_PORT}:${JAVA_PORT}/tcp"
      - "${BEDROCK_PORT}:${BEDROCK_PORT}/udp"
    environment:
      EULA: "TRUE"
      TZ: ${TZ}
      # 호스트 사용자와 파일 소유권 일치 (uid 1001)
      UID: "${MC_UID}"
      GID: "${MC_GID}"
      # --- 서버 구현체: Leaf 1.21.11 Build #179 (고정) ---
      TYPE: CUSTOM
      CUSTOM_SERVER: ${LEAF_JAR_URL}
      VERSION: ${MC_VERSION}
      # --- JVM: Xms 1G / Xmx 4G, Java 21 기본 G1GC (추가 GC 플래그 없음) ---
      INIT_MEMORY: ${JVM_INIT_MEMORY}
      MAX_MEMORY: ${JVM_MAX_MEMORY}
      USE_AIKAR_FLAGS: "false"
      USE_MEOWICE_FLAGS: "false"
      # --- RCON (비밀번호는 secrets/rcon_password 파일, compose에는 없음) ---
      ENABLE_RCON: "true"
      RCON_PASSWORD_FILE: /run/secrets/rcon_password
      # --- server.properties (online-mode 유지) ---
      ONLINE_MODE: "true"
      # --- 화이트리스트 (Discord 봇이 관리) ---
      ENABLE_WHITELIST: "true"
      VIEW_DISTANCE: "${VIEW_DISTANCE:-7}"
      SIMULATION_DISTANCE: "${SIMULATION_DISTANCE:-4}"
      MAX_PLAYERS: "${MAX_PLAYERS:-10}"
      SYNC_CHUNK_WRITES: "true"
      PAUSE_WHEN_EMPTY_SECONDS: "60"
      USE_NATIVE_TRANSPORT: "true"
      # --- 플러그인 자동 다운로드 (공식 API URL, .env에서 고정) ---
      PLUGINS: |
        ${GEYSER_URL}
        ${FLOODGATE_URL}
        ${VIAVERSION_URL}
        ${CHUNKY_URL}
    volumes:
      - ./data:/data
      - ./secrets/rcon_password:/run/secrets/rcon_password:ro
    # 호스트 12GB / 2OCPU 중 일부만 사용 (기존 서비스 보호)
    mem_limit: 5g
    cpus: 1.75
    cpu_shares: 1024
    # 봇(mcbot)과만 통신하는 전용 네트워크 (미게시, 기본망은 백업용으로 유지)
    networks:
      - default
      - mc-discord
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  minecraft-backup:
    image: itzg/mc-backup
    container_name: minecraft-backup
    restart: unless-stopped
    depends_on:
      - minecraft
    environment:
      TZ: ${TZ}
      RCON_HOST: minecraft
      RCON_PORT: "25575"
      RCON_PASSWORD_FILE: /run/secrets/rcon_password
      SRC_DIR: /data
      DEST_DIR: /backups
      BACKUP_NAME: world
      BACKUP_METHOD: tar
      BACKUP_INTERVAL: ${BACKUP_INTERVAL}
      BACKUP_ON_STARTUP: "true"
      INITIAL_DELAY: "3m"
      PRUNE_BACKUPS_DAYS: ${BACKUP_RETENTION_DAYS}
      TAR_COMPRESS_METHOD: zstd
      TAR_COMPRESS_PARAMETERS: ${BACKUP_COMPRESS_ARGS}
      ENABLE_SAVE_ALL: "true"
      ENABLE_SYNC: "true"
      EXCLUDES: ${BACKUP_EXCLUDES}
      RCON_RETRIES: "5"
      RCON_RETRY_INTERVAL: "10s"
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
      - ./secrets/rcon_password:/run/secrets/rcon_password:ro
    # 백업이 게임 서버와 CPU 경쟁을 하지 않도록 강하게 제한
    mem_limit: 1g
    cpus: 0.5
    cpu_shares: 128
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # 봇과 플러그인의 전용망 (외부 네트워크)
  mc-discord:
    external: true
